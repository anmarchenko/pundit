name: RSpec

on:
  workflow_call:
    inputs:
      ruby-version:
        required: true
        type: string
      allow-failure:
        default: false
        type: boolean
    secrets:
      DD_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow-failure }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix || steps.fallback.outputs.matrix }}
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    steps:
      - name: Initialize fallback matrix
        id: fallback
        run: echo 'matrix={"include":[{"ci_node_index":0,"ci_node_total":1}]}' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          rubygems: latest
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Install ddtest
        if: ${{ env.DD_API_KEY != '' }}
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/DataDog/ddtest/releases/latest/download/ddtest-linux-amd64 -o bin/ddtest
          chmod +x bin/ddtest
      - name: Configure Datadog Test Optimization
        if: ${{ env.DD_API_KEY != '' }}
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: ruby
          api_key: ${{ env.DD_API_KEY }}
          site: datadoghq.com
      - name: Plan tests
        id: plan
        run: |
          if [ -z "$DD_API_KEY" ]; then
            mkdir -p .testoptimization
            touch .testoptimization/datadog-disabled
            exit 0
          fi

          rm -rf .testoptimization
          bin/ddtest plan --platform ruby --framework rspec --min-parallelism 1 --max-parallelism 2
      - uses: actions/upload-artifact@v4
        with:
          name: ddtest-plan-${{ inputs.ruby-version }}
          path: |
            .testoptimization/
            bin/ddtest
          include-hidden-files: true
          if-no-files-found: error

  test:
    needs: plan
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow-failure }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          rubygems: latest
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ddtest-plan-${{ inputs.ruby-version }}
          path: .
      - name: Prepare ddtest
        if: ${{ env.DD_API_KEY != '' }}
        run: |
          test -f .testoptimization/manifest.txt
          chmod +x bin/ddtest
      - name: Configure Datadog Test Optimization
        if: ${{ env.DD_API_KEY != '' }}
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: ruby
          api_key: ${{ env.DD_API_KEY }}
          site: datadoghq.com
      - name: Run tests with Datadog Test Parallelization
        if: ${{ env.DD_API_KEY != '' }}
        run: bin/ddtest run --platform ruby --framework rspec --ci-node ${{ matrix.ci_node_index }}
      - name: Run tests
        if: ${{ env.DD_API_KEY == '' }}
        run: bundle exec rspec
